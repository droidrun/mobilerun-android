name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Generated constants are up to date
        run: |
          python3 tool/generate-constants.py
          git diff --exit-code -- protocol/src/commonMain/kotlin/ai/mobilerun/stream/protocol/Constants.kt
      - name: Check
        run: ./gradlew check apiCheck --no-daemon
